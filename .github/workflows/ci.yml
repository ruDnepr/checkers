name: Flutter
on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
      - run: flutter pub get
      - name: Analyze
        shell: bash
        run: |
          flutter analyze --no-pub > /tmp/analyze.txt 2>&1 || status=$?
          cat /tmp/analyze.txt
          if [ -n "$status" ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/analyze.txt').read_text()
          for i in range(0, min(len(text), 35000), 3500):
              part = text[i:i+3500].replace('%','%25').replace('\n','%0A').replace('\r','%0D')
              print(f'::error title=analyzer-output-{i//3500:02d}::{part}')
          PY
          fi
          exit ${status:-0}
      - name: Test
        if: always()
        shell: bash
        run: |
          flutter test --reporter expanded > /tmp/tests.txt 2>&1 || status=$?
          cat /tmp/tests.txt
          if [ -n "$status" ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/tests.txt').read_text()
          blocks = text.split('[E]')[1:] or [text[-3900:]]
          for block in blocks[:8]:
              print('::error title=test-output::' + block[:3900].replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PY
          fi
          exit ${status:-0}
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
      - name: Build debug APK
        shell: bash
        run: |
          flutter build apk --debug > /tmp/build.txt 2>&1 || status=$?
          cat /tmp/build.txt
          if [ -n "$status" ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/build.txt').read_text()[-3900:]
          print('::error title=android-build-output::' + text.replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PY
          fi
          exit ${status:-0}
  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
      - name: Build unsigned iOS app
        shell: bash
        run: |
          flutter build ios --simulator --debug --no-codesign > /tmp/build.txt 2>&1 || status=$?
          cat /tmp/build.txt
          if [ -n "$status" ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/build.txt').read_text()[-3900:]
          print('::error title=ios-build-output::' + text.replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PY
          fi
          exit ${status:-0}
  android-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android emulator integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./tool/run_integration.sh
