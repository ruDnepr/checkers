name: Flutter

# Two jobs only:
#   * android — анализ, тесты и готовые APK (debug и release) как артефакты;
#   * ios     — сборка приложения для симулятора без подписи.
#
# Тесты на эмуляторе Android — шаг внутри задания android. Эмулятор на общих
# раннерах часто не загружается, поэтому этот шаг не блокирует сборку и
# запускается только по расписанию, вручную или меткой `device` на pull request.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.8'
  # Where the widget test writes layout screenshots when DIANA_CAPTURE=1.
  SCREENSHOT_DIR: build/screenshots

jobs:
  android:
    name: Android — анализ, тесты и APK
    runs-on: ubuntu-latest
    # Анализ, тесты и две сборки занимают около 12 минут; остальное оставлено
    # на шаг с эмулятором, у которого есть свой предел в 45 минут.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Установить зависимости
        run: flutter pub get

      - name: Анализ кода
        shell: bash
        run: |
          flutter analyze --no-pub > /tmp/analyze.txt 2>&1 || status=$?
          cat /tmp/analyze.txt
          if [ -n "$status" ]; then
            python3 - <<'PY'
          from pathlib import Path

          text = Path('/tmp/analyze.txt').read_text()
          for i in range(0, min(len(text), 35000), 3500):
              part = (
                  text[i:i + 3500]
                  .replace('%', '%25')
                  .replace('\n', '%0A')
                  .replace('\r', '%0D')
              )
              print(f'::error title=analyzer-output-{i // 3500:02d}::{part}')
          PY
          fi
          exit ${status:-0}

      - name: Тесты
        shell: bash
        env:
          DIANA_CAPTURE: '1'
        run: |
          flutter test --reporter expanded > /tmp/tests.txt 2>&1 || status=$?
          cat /tmp/tests.txt
          if [ -n "$status" ]; then
            python3 - <<'PY'
          from pathlib import Path

          text = Path('/tmp/tests.txt').read_text()
          blocks = [
              'EXCEPTION CAUGHT' + b
              for b in text.split('EXCEPTION CAUGHT')[1:]
          ] or [text[-3900:]]
          for block in blocks[:8]:
              print(
                  '::error title=test-output::'
                  + block[:3900].replace('%', '%25').replace('\n', '%0A')
              )
          PY
          fi
          exit ${status:-0}

      - name: Собрать debug APK
        shell: bash
        run: |
          flutter build apk --debug > /tmp/build-debug.txt 2>&1 || status=$?
          cat /tmp/build-debug.txt
          if [ -n "$status" ]; then
            python3 - <<'PY'
          from pathlib import Path

          text = Path('/tmp/build-debug.txt').read_text()[-3900:]
          print(
              '::error title=android-debug-build::'
              + text.replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
          )
          PY
          fi
          exit ${status:-0}

      # Подписан отладочным ключом, поэтому ставится на телефон без keystore.
      - name: Собрать release APK
        shell: bash
        run: |
          flutter build apk --release > /tmp/build-release.txt 2>&1 || status=$?
          cat /tmp/build-release.txt
          if [ -n "$status" ]; then
            python3 - <<'PY'
          from pathlib import Path

          text = Path('/tmp/build-release.txt').read_text()[-3900:]
          print(
              '::error title=android-release-build::'
              + text.replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
          )
          PY
          fi
          exit ${status:-0}

      - name: Проверить, что APK собрались
        if: always()
        shell: bash
        run: |
          ls -l build/app/outputs/flutter-apk/*.apk || echo 'APK не найдены'
          test -f build/app/outputs/flutter-apk/app-debug.apk
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Сложить скриншоты раскладки
        if: always()
        shell: bash
        run: |
          mkdir -p "$SCREENSHOT_DIR"
          cp /tmp/diana-*.png "$SCREENSHOT_DIR"/ 2>/dev/null || true
          ls -l "$SCREENSHOT_DIR" || true

      - name: Выгрузить APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diana-checkers-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn

      - name: Выгрузить скриншоты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diana-checkers-screenshots
          path: build/screenshots
          if-no-files-found: ignore

      - name: Включить ускорение эмулятора
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'schedule' ||
          (github.event_name == 'pull_request' &&
          github.event.action == 'labeled' &&
          contains(github.event.pull_request.labels.*.name, 'device'))
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Совещательный шаг: результат виден в аннотациях, но не блокирует APK.
      - name: Тесты на эмуляторе Android
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'schedule' ||
          (github.event_name == 'pull_request' &&
          github.event.action == 'labeled' &&
          contains(github.event.pull_request.labels.*.name, 'device'))
        continue-on-error: true
        # Предел шага больше суммы пределов внутри скрипта (загрузка эмулятора
        # 10 мин + прогрев 7 мин + 4 теста по 3 мин), чтобы зависший эмулятор
        # давал обычный сбой с логами, а не молчаливое убийство шага.
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./tool/run_integration.sh

      - name: Выгрузить логи устройства
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: diana-checkers-device-logs
          path: |
            /tmp/integration.txt
            /tmp/device.txt
          if-no-files-found: ignore

  ios:
    name: iOS — сборка без подписи
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Собрать приложение для симулятора
        shell: bash
        run: |
          flutter build ios --simulator --debug --no-codesign > /tmp/build.txt 2>&1 || status=$?
          cat /tmp/build.txt
          if [ -n "$status" ]; then
            python3 - <<'PY'
          from pathlib import Path

          text = Path('/tmp/build.txt').read_text()[-3900:]
          print(
              '::error title=ios-build-output::'
              + text.replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
          )
          PY
          fi
          exit ${status:-0}

      - name: Упаковать приложение
        if: always()
        shell: bash
        run: |
          if [ -d build/ios/iphonesimulator/Runner.app ]; then
            cd build/ios/iphonesimulator && zip -qry "$GITHUB_WORKSPACE/Runner-simulator.zip" Runner.app
          else
            echo 'Runner.app не найден'
          fi

      - name: Выгрузить приложение
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diana-checkers-ios-simulator
          path: Runner-simulator.zip
          if-no-files-found: warn
