name: Flutter
on:
  # Pull requests are the review path; running both events for the same commit
  # doubled the emulator jobs and starved the runners.
  push:
    branches: [main]
  pull_request:
  # The hosted emulator is not reliable enough to gate every commit: it hangs
  # often enough that a run either times out or takes the whole runner. The
  # device job therefore runs nightly and on demand, and the fast jobs are the
  # gate for pull requests.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
      - run: flutter pub get
      - name: Analyze
        shell: bash
        run: |
          flutter analyze --no-pub > /tmp/analyze.txt 2>&1 || status=$?
          cat /tmp/analyze.txt
          if [ -n "$status" ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/analyze.txt').read_text()
          for i in range(0, min(len(text), 35000), 3500):
              part = text[i:i+3500].replace('%','%25').replace('\n','%0A').replace('\r','%0D')
              print(f'::error title=analyzer-output-{i//3500:02d}::{part}')
          PY
          fi
          exit ${status:-0}
      - name: Test
        if: always()
        env:
          DIANA_CAPTURE: '1'
        shell: bash
        run: |
          flutter test --reporter expanded > /tmp/tests.txt 2>&1 || status=$?
          cat /tmp/tests.txt
          if [ -n "$status" ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/tests.txt').read_text()
          blocks = ['EXCEPTION CAUGHT' + b for b in text.split('EXCEPTION CAUGHT')[1:]] or [text[-3900:]]
          for block in blocks[:8]:
              print('::error title=test-output::' + block[:3900].replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PY
          fi
          exit ${status:-0}
      - name: Export dependency lockfile
        if: always()
        shell: bash
        run: |
          if [ -f pubspec.lock ]; then gzip -c pubspec.lock | base64 -w0 > /tmp/lock.b64; else touch /tmp/lock.b64; fi
          python3 - <<'PY'
          data = open('/tmp/lock.b64').read()
          for chunk in range(10):
              part = data[chunk*3900:(chunk+1)*3900]
              if part: print(f'::notice title=lock-{chunk:04d}::{part}')
          PY
      - name: Export visual diagnostic home 1
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/diana-home.png ]; then base64 -w0 /tmp/diana-home.png > /tmp/visual-home.b64; else touch /tmp/visual-home.b64; fi
          python3 - <<'PY'
          data=open('/tmp/visual-home.b64').read()
          for chunk in range(0, 10):
              part=data[chunk*3900:(chunk+1)*3900]
              if part: print(f'::notice title=visual-home-{chunk:04d}::{part}')
          PY
      - name: Export visual diagnostic home 2
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/diana-home.png ]; then base64 -w0 /tmp/diana-home.png > /tmp/visual-home.b64; else touch /tmp/visual-home.b64; fi
          python3 - <<'PY'
          data=open('/tmp/visual-home.b64').read()
          for chunk in range(10, 20):
              part=data[chunk*3900:(chunk+1)*3900]
              if part: print(f'::notice title=visual-home-{chunk:04d}::{part}')
          PY
      - name: Export visual diagnostic home 3
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/diana-home.png ]; then base64 -w0 /tmp/diana-home.png > /tmp/visual-home.b64; else touch /tmp/visual-home.b64; fi
          python3 - <<'PY'
          data=open('/tmp/visual-home.b64').read()
          for chunk in range(20, 30):
              part=data[chunk*3900:(chunk+1)*3900]
              if part: print(f'::notice title=visual-home-{chunk:04d}::{part}')
          PY
      - name: Export visual diagnostic home 4
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/diana-home.png ]; then base64 -w0 /tmp/diana-home.png > /tmp/visual-home.b64; else touch /tmp/visual-home.b64; fi
          python3 - <<'PY'
          data=open('/tmp/visual-home.b64').read()
          for chunk in range(30, 40):
              part=data[chunk*3900:(chunk+1)*3900]
              if part: print(f'::notice title=visual-home-{chunk:04d}::{part}')
          PY
      - name: Export visual diagnostic game 1
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/diana-game.png ]; then base64 -w0 /tmp/diana-game.png > /tmp/visual-game.b64; else touch /tmp/visual-game.b64; fi
          python3 - <<'PY'
          data=open('/tmp/visual-game.b64').read()
          for chunk in range(0, 10):
              part=data[chunk*3900:(chunk+1)*3900]
              if part: print(f'::notice title=visual-game-{chunk:04d}::{part}')
          PY
      - name: Export visual diagnostic game 2
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/diana-game.png ]; then base64 -w0 /tmp/diana-game.png > /tmp/visual-game.b64; else touch /tmp/visual-game.b64; fi
          python3 - <<'PY'
          data=open('/tmp/visual-game.b64').read()
          for chunk in range(10, 20):
              part=data[chunk*3900:(chunk+1)*3900]
              if part: print(f'::notice title=visual-game-{chunk:04d}::{part}')
          PY
      - name: Export visual diagnostic game 3
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/diana-game.png ]; then base64 -w0 /tmp/diana-game.png > /tmp/visual-game.b64; else touch /tmp/visual-game.b64; fi
          python3 - <<'PY'
          data=open('/tmp/visual-game.b64').read()
          for chunk in range(20, 30):
              part=data[chunk*3900:(chunk+1)*3900]
              if part: print(f'::notice title=visual-game-{chunk:04d}::{part}')
          PY
      - name: Export visual diagnostic game 4
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/diana-game.png ]; then base64 -w0 /tmp/diana-game.png > /tmp/visual-game.b64; else touch /tmp/visual-game.b64; fi
          python3 - <<'PY'
          data=open('/tmp/visual-game.b64').read()
          for chunk in range(30, 40):
              part=data[chunk*3900:(chunk+1)*3900]
              if part: print(f'::notice title=visual-game-{chunk:04d}::{part}')
          PY
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
      - name: Build debug APK
        shell: bash
        run: |
          flutter build apk --debug > /tmp/build.txt 2>&1 || status=$?
          cat /tmp/build.txt
          if [ -n "$status" ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/build.txt').read_text()[-3900:]
          print('::error title=android-build-output::' + text.replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PY
          fi
          exit ${status:-0}
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: /tmp/build.txt
          if-no-files-found: ignore
  ios-build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
      - name: Build unsigned iOS app
        shell: bash
        run: |
          flutter build ios --simulator --debug --no-codesign > /tmp/build.txt 2>&1 || status=$?
          cat /tmp/build.txt
          if [ -n "$status" ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/build.txt').read_text()[-3900:]
          print('::error title=ios-build-output::' + text.replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PY
          fi
          exit ${status:-0}
  android-integration:
    # Also runs for a commit whose message contains [device], which makes a
    # one-off device check possible without waiting for the nightly run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      contains(github.event.head_commit.message, '[device]')
    runs-on: ubuntu-latest
    # Boot (10 min) + one warm-up build (10 min) + four bounded test runs must
    # all fit inside this, otherwise the runner cancels the job at the cap.
    timeout-minutes: 50
    # Hosted runners sometimes hand out a machine without working KVM and the
    # emulator never boots. The job is advisory: it publishes the device log in
    # the check annotations, but builds, analysis and tests stay the gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android emulator integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./tool/run_integration.sh
      - name: Upload device logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: device-logs
          path: |
            /tmp/integration.txt
            /tmp/device.txt
          if-no-files-found: ignore
