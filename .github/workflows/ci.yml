name: Flutter
on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Analyze
        shell: bash
        run: |
          flutter analyze --no-pub --machine > /tmp/analyze.txt 2>&1 || status=$?
          cat /tmp/analyze.txt
          python3 - <<'PY'
          from pathlib import Path
          for line in Path('/tmp/analyze.txt').read_text().splitlines():
              parts = line.split('|', 7)
              if len(parts) == 8:
                  severity, _, _, path, line_no, col, _, message = parts
                  if severity in ('ERROR', 'WARNING', 'INFO'):
                      print(f'::{"error" if severity == "ERROR" else "warning"} file={path},line={line_no},col={col}::{message}')
          PY
          if [ -n "$status" ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/analyze.txt').read_text()
          print('::error title=analyzer-output::' + text[:3900].replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PY
          fi
          exit ${status:-0}
      - name: Test
        if: always()
        shell: bash
        run: |
          flutter test --reporter expanded > /tmp/tests.txt 2>&1 || status=$?
          cat /tmp/tests.txt
          if [ -n "$status" ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/tests.txt').read_text()
          for block in text.split('[E]')[1:]:
              print('::error::' + block[:7000].replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PY
          fi
          exit ${status:-0}
      # Bootstrap native projects from the official Flutter templates.
      - name: Prepare native templates
        if: always()
        shell: bash
        run: |
          flutter create --no-pub --platforms=android,ios --org ru.dnepr --project-name checkers_for_diana /tmp/scaffold
          tar czf /tmp/native.tgz -C /tmp/scaffold android ios
          base64 -w0 /tmp/native.tgz > /tmp/native.b64
      - name: Export native templates 1
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          data=open('/tmp/native.b64').read()
          for chunk in range(0, 10):
              part=data[chunk*4000:(chunk+1)*4000]
              if part:
                  print(f'::notice title=scaffold-{chunk:04d}::{part}')
          PY
      - name: Export native templates 2
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          data=open('/tmp/native.b64').read()
          for chunk in range(10, 20):
              part=data[chunk*4000:(chunk+1)*4000]
              if part:
                  print(f'::notice title=scaffold-{chunk:04d}::{part}')
          PY
      - name: Export native templates 3
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          data=open('/tmp/native.b64').read()
          for chunk in range(20, 30):
              part=data[chunk*4000:(chunk+1)*4000]
              if part:
                  print(f'::notice title=scaffold-{chunk:04d}::{part}')
          PY
      - name: Export native templates 4
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          data=open('/tmp/native.b64').read()
          for chunk in range(30, 40):
              part=data[chunk*4000:(chunk+1)*4000]
              if part:
                  print(f'::notice title=scaffold-{chunk:04d}::{part}')
          PY
      - name: Export native templates 5
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          data=open('/tmp/native.b64').read()
          for chunk in range(40, 50):
              part=data[chunk*4000:(chunk+1)*4000]
              if part:
                  print(f'::notice title=scaffold-{chunk:04d}::{part}')
          PY
